{% extends 'perfect/bacompt.html' %} 
{% load static %} 
{% block title %}Mot de passe oublié{% endblock title %} 
{% block content %}
    <div class="login-box">
        <div class="login-logo" style="font-size: 30px">
            <img src="{% static 'site_assets/images/Maflot-f.png' %}" alt="MaFlot Logo" class="img-fluid" loading="eager" />
        </div>
        <div class="card" style="border-radius: 18px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
            <div class="card-body login-card-body" style="background-color:rgba(255, 255, 255, 0.1);border-radius: 10px">
                <h3 class="text-center text-secondary"><img src="{% static 'password.png' %}" alt="" srcset=""></h3>
                <p class="login-box-msg" style="color: rgba(2, 26, 78, 0.63)">Vous avez oublié votre mot de passe? Ici, vous pouvez facilement récupérer un nouveau mot de passe.</p>
                <form action="{% url 'request_email' %}" name="login_form" method="post" id="loginForm">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email@.com..." style="border-radius: 50px 0 0 50px; background-color:rgba(255, 255, 255, 0.1); color: rgba(2, 26, 78, 0.63)" required>
                        <div class="input-group-append">
                            <div class="input-group-text" style="border-radius: 0 50px 50px 0">
                                <span class="fas fa-envelope" style="color: rgba(2, 26, 78, 0.63)"></span>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid text-center">
                        <button type="submit" class="btn btn-outline-primary w-50" id="loginButton" style="border-radius: 50px; border-color:rgba(2, 26, 78, 0.63)">
                            <span id="buttonText" style="color: rgba(2, 26, 78, 0.63)">Envoyer</span>
                            <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
                <p class="mt-3 mb-1 text-center">
                    <a href="{% url 'login' %}" style="color: rgba(2, 26, 78, 0.63)">Se connecter</a>
                </p>
            </div>
       </div>
    </div>
{% endblock content %}
