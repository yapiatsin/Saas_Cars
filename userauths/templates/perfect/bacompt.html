<body class="hold-transition login-page">
    <div class="auth-bg-container">
        <canvas id="authBackground"></canvas>
    </div>
    {% block after_bg %}{% endblock %}
    {% block content %}

    {% endblock content %}

    {% block custom_js %}
    <script>
        function updateTable(month, year) {
            const url = `?month=${month}&year=${year}`;
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const newDoc = parser.parseFromString(html, 'text/html');
                    const newTable = newDoc.querySelector('table'); // Remplace uniquement le tableau
                    const oldTable = document.querySelector('table');
                    if (newTable && oldTable) {
                        oldTable.innerHTML = newTable.innerHTML; // Mise à jour des données
                    }
                })
                .catch(err => console.error('Error updating table:', err));
        }

        function changeMonth(offset) {
            let month = parseInt(document.getElementById('month').value);
            let year = parseInt(document.getElementById('year').value);
            month += offset;
            if (month > 12) {
                month = 1;
                year++;
            } else if (month < 1) {
                month = 12;
                year--;
            }
            document.getElementById('month').value = month;
            document.getElementById('year').value = year;
            updateTable(month, year);
        }

        function selectMonthYear() {
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;
            updateTable(month, year);
        }
    </script>
    {% endblock custom_js %}
    <script src="{% static 'pb/plugins/jquery/jquery.min.js' %} "></script>
    <script>
        var loginForm = document.getElementById("loginForm");
        if (loginForm) {
            loginForm.addEventListener("submit", function(event) {
                event.preventDefault();
                var button = document.getElementById("loginButton");
                var buttonText = document.getElementById("buttonText");
                var spinner = document.getElementById("spinner");
                if (buttonText) buttonText.classList.add("d-none");
                if (spinner) spinner.classList.remove("d-none");
                setTimeout(function() { loginForm.submit(); }, 500);
            });
        }
    </script>
    <script>
        (function() {
            var canvas = document.getElementById('authBackground');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');

            function getSize() {
                return {
                    w: window.innerWidth || document.documentElement.clientWidth,
                    h: window.innerHeight || document.documentElement.clientHeight
                };
            }

            var size = getSize();
            var ww = size.w;
            var wh = size.h;
            resizeCanvas();

            var partCount = 120;
            var particles = [];

            function Particle() {
                this.color = 'rgba(255,255,255,' + (0.3 + Math.random() * 0.7) + ')';
                this.x = randomInt(0, ww);
                this.y = randomInt(0, wh);
                this.direction = { x: -1 + Math.random() * 2, y: -1 + Math.random() * 2 };
                this.vx = 0.2 + 0.4 * Math.random();
                this.vy = 0.2 + 0.4 * Math.random();
                this.radius = randomInt(1, 3);
                this.float = function() {
                    this.x += this.vx * this.direction.x;
                    this.y += this.vy * this.direction.y;
                };
                this.changeDirection = function(axis) { this.direction[axis] *= -1; };
                this.boundaryCheck = function() {
                    if (this.x >= ww) { this.x = ww; this.changeDirection('x'); } else if (this.x <= 0) { this.x = 0; this.changeDirection('x'); }
                    if (this.y >= wh) { this.y = wh; this.changeDirection('y'); } else if (this.y <= 0) { this.y = 0; this.changeDirection('y'); }
                };
                this.draw = function() {
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                    ctx.fill();
                };
            }

            function drawBackground() {
                // fond global très clair
                var baseGradient = ctx.createLinearGradient(0, 0, ww, wh);
                baseGradient.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
                baseGradient.addColorStop(1, 'rgba(230, 240, 255, 0.95)');
                ctx.fillStyle = baseGradient;
                ctx.fillRect(0, 0, ww, wh);

                // halo bleu circulaire centré (autour du formulaire)
                var radius = Math.min(ww, wh) * 0.55;
                var radial = ctx.createRadialGradient(
                    ww / 2, wh / 2, 0,
                    ww / 2, wh / 2, radius
                );
                radial.addColorStop(0, 'rgba(201, 224, 253, 0.98)');   // centre bleu soutenu
                radial.addColorStop(0.5, 'rgba(201, 224, 253, 0.98)');
                radial.addColorStop(1, 'rgba(219, 233, 250, 0.98)');    // fondu vers transparent
                ctx.fillStyle = radial;
                ctx.fillRect(0, 0, ww, wh);
            }

            function clearCanvas() {
                drawBackground();
            }

            function createParticles() {
                particles = [];
                for (var i = 0; i < partCount; i++) particles.push(new Particle());
            }

            function drawParticles() {
                for (var i = 0; i < particles.length; i++) particles[i].draw();
            }

            function updateParticles() {
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].float();
                    particles[i].boundaryCheck();
                }
            }

            function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }

            function resizeCanvas() {
                size = getSize();
                ww = size.w;
                wh = size.h;
                var dpr = window.devicePixelRatio || 1;
                canvas.width = ww * dpr;
                canvas.height = wh * dpr;
                canvas.style.width = ww + 'px';
                canvas.style.height = wh + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                clearCanvas();
                createParticles();
                drawParticles();
            }

            function animateParticles() {
                clearCanvas();
                drawParticles();
                updateParticles();
                requestAnimationFrame(animateParticles);
            }

            createParticles();
            drawParticles();
            requestAnimationFrame(animateParticles);

            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
    <script src="{% static 'pb/plugins/bootstrap/js/bootstrap.bundle.min.js' %} "></script>
    <script src="{% static 'pb/dists/js/adminlte.min.js' %} "></script>
    <script src="{% static 'pb/plugins/jsgrid/demos/db.js' %} "></script>
    <script src="{% static 'pb/plugins/jsgrid/jsgrid.min.js' %} "></script>
    <script src="{% static 'pb/plugins/datatables/jquery.dataTables.js' %} "></script>
    <script src="{% static 'pb/plugins/datatables-bs4/js/dataTables.bootstrap4.js' %} "></script>
    <script src="{% static 'pb/plugins/sweetalert2/sweetalert2.min.js' %} "></script>
    <!-- Toastr -->
    <script src="{% static 'pb/plugins/toastr/toastr.min.js' %} "></script>
    <script>
        $(function() {
            $("#example1").DataTable();
            $('#example2').DataTable({
                "paging ": true,
                "lengthChange ": false,
                "searching ": false,
                "ordering ": true,
                "info ": true,
                "autoWidth ": false,
            });
        });
    </script>

    <script type="text/javascript">
        $(function() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000
            });
            {% if request.resolver_match.url_name != 'login' %}
            {% if messages %}
                {% for msg in messages %}
                    {% if msg.tags == "error" %}
            toastr.error('{{ msg|escapejs }}', '', {
                timeOut: 5000,
                progressBar: true,
                closeButton: false,
                positionClass: 'toast-top-center'
            });
                    {% else %}
            toastr.success('{{ msg|escapejs }}', '', {
                timeOut: 5000,
                progressBar: true,
                closeButton: false,
                positionClass: 'toast-top-center'
            });
                    {% endif %}
                {% endfor %}
            {% endif %}
            {% endif %}
        });
    </script>
</body>
</html>
